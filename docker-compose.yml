services:
  postgres:
    image: postgres:16
    container_name: fixmycity_postgres
    restart: always
    environment:
      POSTGRES_USER: fixmycity
      POSTGRES_PASSWORD: fixmycity_pass
      POSTGRES_DB: fixmycity_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  auth-service:
    build:
      context: .
      dockerfile: auth_service/Dockerfile
    container_name: auth_service
    restart: always
    expose:
      - "8001"
    environment:
      DATABASE_URL: postgresql://fixmycity:fixmycity_pass@postgres:5432/fixmycity_db
    depends_on:
      - postgres
    volumes:
      - ./auth_service:/app/auth_service
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8001 --reload"

  city-operation-service:
    build:
      context: .
      dockerfile: city_operation_service/Dockerfile
    container_name: city_operation_service
    restart: always
    expose:
      - "8002"
    environment:
      DATABASE_URL: postgresql://fixmycity:fixmycity_pass@postgres:5432/fixmycity_db
    depends_on:
      - postgres
    volumes:
      - ./city_operation_service:/app/city_operation_service
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8002 --reload"

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: fixmycity_nginx
    restart: always
    ports:
      - "9090:8080"
    depends_on:
      - auth-service
      - city-operation-service
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  postgres_data:
